name: Update GitHub Readme Stats

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write

# Never allow two stats updates to modify main at the same time.
concurrency:
  group: update-github-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Determine whether to run
        id: schedule
        shell: bash
        run: |
          set -euo pipefail

          WEEK=$(date -u +%V)

          if (( WEEK % 2 == 0 )); then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "ISO week ${WEEK} is even; updating stats."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "ISO week ${WEEK} is odd; skipping stats update."
          fi

      - name: Generate stats card
        if: steps.schedule.outputs.run == 'true'
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=camkhardin&show_icons=true&hide_border=true&theme=transparent&include_all_commits=true&count_private=true
          path: images/github-stats.svg
          token: ${{ secrets.GH_STATS_TOKEN != '' && secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      # Re-sync with origin/main before creating the automated commit.
      # This prevents "fetch first" when main changed after checkout.
      - name: Rebase generated changes onto latest main
        if: steps.schedule.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          git rebase origin/main

      - name: Commit and push updated card
        if: steps.schedule.outputs.run == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update GitHub stats card"
          file_pattern: images/github-stats.svg
